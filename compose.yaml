services:
  stella:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./sites.json:/app/sites.json:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
